<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2025-03-14 题库复习（13 个题库 / 258 题）</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 12px; color: #222; background: #e8e8e8; line-height: 1.5; }

    .sc { color: #16a34a; font-weight: 600; }
    .sw { color: #dc2626; font-weight: 600; }

    /* ---------- 纸张 ---------- */
    .page-wrap { max-width: 820px; margin: 0 auto; padding: 10px; }
    .page { background: #fff; padding: 12mm 14mm; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); border-radius: 4px; }
    .page-title { font-size: 13px; font-weight: bold; text-align: center; padding-bottom: 5px; margin-bottom: 6px; border-bottom: 2px solid #333; }

    /* ---------- 题目 ---------- */
    /* 左侧色条标记整题对错，扫一眼就能分出哪些做错了 */
    .q-item { padding: 3px 0 3px 6px; border-bottom: 1px dashed #ddd; border-left: 3px solid transparent; }
    .q-item.ok  { border-left-color: #16a34a; background: #f5fdf7; }
    .q-item.bad { border-left-color: #dc2626; background: #fef5f5; }
    .q-header { font-weight: 600; font-size: 11.5px; }
    .q-bank { font-size: 10px; font-weight: 400; color: #2563eb; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 3px; padding: 0 4px; margin-right: 4px; }
    .q-type { font-size: 10px; font-weight: 400; color: #9333ea; background: #faf5ff; border: 1px solid #e9d5ff; border-radius: 3px; padding: 0 4px; margin-right: 4px; }
    .q-opts { margin-left: 16px; display: flex; flex-wrap: wrap; gap: 2px 6px; font-size: 11px; }
    .opt-btn { cursor: pointer; padding: 1px 6px; border-radius: 3px; border: 1px solid #d0d0d0; background: #fafafa; color: #333; white-space: nowrap; transition: all 0.15s; user-select: none; }
    .opt-btn:hover { border-color: #888; background: #f0f0f0; }
    .opt-btn.sel { border-color: #2563eb; background: #dbeafe; color: #1e40af; }
    .opt-btn.correct { border-color: #16a34a; background: #dcfce7; color: #166534; }
    .opt-btn.wrong { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
    /* 漏选的正确项：黄色底 + 绿色虚线框 + 「漏选」字样，跟「选对」区分开 */
    .opt-btn.missed { border: 1px dashed #16a34a; background: #fef9c3; color: #854d0e; }
    .opt-btn.missed::after { content: '　漏选'; font-size: 9px; font-weight: 600; color: #b45309; }
    .opt-btn.wrong::after { content: '　错选'; font-size: 9px; font-weight: 600; color: #b91c1c; }
    .btn-submit { border-color: #2563eb; background: #2563eb; color: #fff; }
    .btn-submit:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .q-answer { font-size: 10px; color: #999; display: none; }
    .q-answer.show { display: inline; }

    /* ---------- 窄屏 ---------- */
    @media (max-width: 640px) {
        .page { padding: 10px 12px; }
        .q-opts { font-size: 10.5px; margin-left: 10px; }
    }

    /* ---------- 打印：一页一张纸（保留对/错配色） ---------- */
    @media print {
        body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .page-wrap { max-width: none; padding: 0; }
        .page { box-shadow: none; border-radius: 0; margin: 0; padding: 8mm 10mm; page-break-after: always; }
        .page:last-child { page-break-after: auto; }
    }
</style>
</head>
<body>

<div class="page-wrap" id="app"></div>

<script src="crm.js"></script>
</body>
</html>
