<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>写笔记</title>
<link rel="stylesheet" href="md阅读器.css">
<style>
  /* 本页特有样式 */
  main { padding-top: 18px; padding-bottom: 8vh; }
  .box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 30px; }
  #editor {
    font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px;
    width: 100%; min-height: 300px; resize: vertical; line-height: 1.7;
  }
  #editor:focus { outline: 2px solid #2a7ae2; outline-offset: -1px; }
  .hint { font-size: 13px; color: var(--mut); }
  #docpane { border-top: 1px dashed var(--line); padding-top: 10px; }
  header { flex-wrap: wrap; }
  header button:disabled { opacity: .45; cursor: default; }
  header button.on { border-color: #2a7ae2; color: #2a7ae2; }

  /* 每条保存的内容 = 一个卡片 */
  #doc { display: flex; flex-direction: column; gap: 14px; }
  .entry {
    border: 1px solid var(--line);
    border-left: 3px solid #2a7ae2;
    border-radius: 6px;
    padding: 12px 16px;
  }
  .entry > :first-child { margin-top: 0; }
  .entry > :last-child { margin-bottom: 0; }
  .entry img { border-radius: 4px; max-height: 70vh; object-fit: contain; }
  /* 时间默认隐藏，点页头「时间」才显示 */
  .entry .time { display: none; font-size: 12px; color: var(--mut); margin-bottom: 6px; }
  body.showtime .entry .time { display: block; }

  /* 底部：OSS 上的文件列表 */
  #filesbox { margin-top: 34px; }
  #filelist { display: flex; flex-direction: column; margin-top: 10px; }
  .frow {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; border-bottom: 1px dotted var(--line); font-size: 13px;
  }
  .frow .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .fname a { text-decoration: none; }
  .frow .fsize, .frow .ftime { color: var(--mut); font-size: 12px; white-space: nowrap; }
  .frow button {
    font: inherit; font-size: 12px; color: var(--mut); background: none;
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; cursor: pointer;
  }
  .frow button:hover { color: #2a7ae2; border-color: #2a7ae2; }
</style>
</head>
<body>
<header>
  <button id="save">保存到 OSS</button>
  <button id="reload" title="重新从 OSS 读取">⟳</button>
  <button id="imgbtn" title="插入图片：也可以直接 Ctrl+V 粘贴截图，或把图片拖进来">图片</button>
  <button id="filebtn" title="上传任意文件到 OSS 的 files/ 目录">文件</button>
  <button id="togtime" title="显示 / 隐藏保存时间">时间</button>
  <span id="status">就绪</span>
  <input type="file" id="imgfile" accept="image/*" hidden>
  <input type="file" id="anyfile" hidden>
</header>
<main>
  <div class="box">
    <textarea id="editor" placeholder="在这里写…&#10;&#10;支持 Markdown：# 标题、**加粗**、- 列表、&gt; 引用、```代码块```"></textarea>
    <div class="hint">
      写完点「<b>保存到 OSS</b>」（或 Ctrl+S）。内容会<b>加在最上面</b>（最新在上），不会覆盖以前写的。
      目标文件 <code id="targetName"></code>。<br>
      图片：点「<b>图片</b>」选一张、直接 <b>Ctrl+V</b> 粘截图、或把图片<b>拖进来</b> ——
      会先传到 OSS 的 <code>images/</code> 里，再自动插到光标处。
    </div>
  </div>
  <div id="docpane">
    <h3 style="margin-top:0">已保存的内容</h3>
    <div id="doc"></div>
  </div>
  <details id="filesbox">
    <summary>📁 文件（<span id="filecount">0</span>）</summary>
    <div id="filelist"></div>
  </details>
</main>
<script src="md渲染.js"></script>
<script src="写笔记.js"></script>
</body>
</html>
