<body>

<header class="top">
  <div class="top-in">
    <h1 id="title">标准操作程序 · 第 5 章 恶劣天气 · 填空复习</h1>
    <div class="sub" id="sub">共 {{N}} 题</div>
    <div class="switch">

<div class="foot">
  用法：在横线上填关键词，按 <b>回车</b> 判这一题并跳到下一题（改完离开输入框也会自动判）；
  想一次对完就点「检查全部」。判分不管空格和标点，「10,000」写「10000」也算对。<br>
  错的题下面会给出答案和出处（出处是 SOP 的条款号，方便回去翻原文）。内容取自 SOP R05 第 5 章。
  本章题目由手册正文自动抽取，答案都取自原文；个别题表述不够顺时，可以直接改 <code>js/questions-ch5.js</code>。
